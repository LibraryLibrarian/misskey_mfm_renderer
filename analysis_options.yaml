analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # 新しいFlutterはこれらの除外を自動で書き加えるため、あらかじめ記載しておく。
    # 記載が無いとCI上でファイルが書き換わり、publishの検証が
    # 「checked-in files are modified」で失敗する
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:pedantic_mono/analysis_options.yaml

linter:
  rules:
    depend_on_referenced_packages: true
    prefer_relative_imports: true
    always_put_control_body_on_new_line: false
