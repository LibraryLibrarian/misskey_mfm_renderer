name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最低サポートバージョン。pubspec.yaml の flutter 制約の下限と揃える
          - name: '3.38.1'
            flutter-version: '3.38.1'
          # 最新安定版。flutter-version を空にすると channel の最新が使われる
          # (subosito/flutter-action は flutter-version に 'stable' を指定できない)
          - name: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Validate package
        run: dart pub publish --dry-run

  example:
    name: Example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Isarのネイティブライブラリ要件に合わせてOSとCPUアーキテクチャを固定
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Run example tests
        working-directory: example
        run: flutter test

      - name: Build example
        working-directory: example
        run: flutter build ${{ matrix.target }} --release
