name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.repository == 'LibraryLibrarian/misskey_mfm_renderer' && github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  quality:
    name: Flutter ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最低サポートバージョン。pubspec.yaml の flutter 制約の下限と揃える
          - name: '3.38.1'
            flutter-version: '3.38.1'
            cached-network-image-major: '3'
          # 最新安定版。flutter-version を空にすると channel の最新が使われる
          # (subosito/flutter-action は flutter-version に 'stable' を指定できない)
          - name: stable
            flutter-version: ''
            cached-network-image-major: '4'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check the resolved cached_network_image major
        env:
          EXPECTED_MAJOR: ${{ matrix.cached-network-image-major }}
        run: |
          set -euo pipefail
          resolved="$(dart pub deps --json | python3 -c \
            'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cached_network_image"))')"
          echo "cached_network_image resolved to $resolved"
          if [ "${resolved%%.*}" != "$EXPECTED_MAJOR" ]; then
            echo "::error::Expected cached_network_image ${EXPECTED_MAJOR}.x, got $resolved"
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: matrix.name != 'stable'
        run: flutter analyze --fatal-infos

      # Flutter 3.47 で package:flutter/material.dart と cupertino.dart が
      # material_ui / cupertino_ui へ分離され、それらの import が非推奨になった。
      # 移行先は Flutter 3.47 以上を要求し、3.38.1 をサポートする間は移行できない。
      # このため stable では、分離に伴う非推奨通知の4文言だけを完全一致で除外する。
      # それ以外の診断 (info を含む) は従来どおり1件でもあれば失敗させる。
      - name: Analyze (excluding the material_ui / cupertino_ui migration notices)
        if: matrix.name == 'stable'
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/analyze-machine.txt"
          # GitHub Actions の bash は -e 付きで起動するため、終了コードを明示的に受け取る
          status=0
          dart analyze --format=machine --fatal-infos > "$out" 2>&1 || status=$?
          python3 - "$out" "$status" <<'PY'
          import collections
          import os
          import sys

          path, status = sys.argv[1], int(sys.argv[2])
          EXCLUDED = {
              "'package:flutter/material.dart' is deprecated and shouldn't be used. Use package:material_ui/material_ui.dart instead. This feature was deprecated after v3.47.0-0.0.pre.",
              "'package:flutter/cupertino.dart' is deprecated and shouldn't be used. Use package:cupertino_ui/cupertino_ui.dart instead. This feature was deprecated after v3.47.0-0.0.pre.",
              "'GlobalMaterialLocalizations' is deprecated and shouldn't be used. Use GlobalMaterialLocalizations from package:material_ui/material_ui.dart instead. This feature was deprecated after v3.47.0-0.0.pre.",
              "'GlobalCupertinoLocalizations' is deprecated and shouldn't be used. Use GlobalCupertinoLocalizations from package:cupertino_ui/cupertino_ui.dart instead. This feature was deprecated after v3.47.0-0.0.pre.",
          }

          # machine 形式は | 区切りで、値の中の \ | 改行 復帰は \\ \| \n \r にエスケープされる。
          # それ以外のエスケープや末尾の孤立した \ は形式外として None を返す
          ESCAPES = {"\\": "\\", "|": "|", "n": "\n", "r": "\r"}

          def split(line):
              fields, current, escaped = [], [], False
              for ch in line:
                  if escaped:
                      if ch not in ESCAPES:
                          return None
                      current.append(ESCAPES[ch])
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == "|":
                      fields.append("".join(current))
                      current = []
                  else:
                      current.append(ch)
              if escaped:
                  return None
              fields.append("".join(current))
              return fields

          def is_int(value, minimum):
              return value.isascii() and value.isdigit() and int(value) >= minimum

          def parse(line):
              fields = split(line)
              if fields is None or len(fields) != 8:
                  return None
              severity, kind, code, file, row, col, length, message = fields
              if (severity not in ("INFO", "WARNING", "ERROR") or not kind or not code
                      or not file or not is_int(row, 1) or not is_int(col, 1)
                      or not is_int(length, 0)):
                  return None
              return fields

          workspace = os.path.realpath(os.environ.get("GITHUB_WORKSPACE", os.getcwd()))
          excluded = collections.Counter()
          remaining, unexpected = [], []
          with open(path, encoding="utf-8") as f:
              for line in f.read().split("\n"):
                  if not line.strip():
                      continue
                  fields = parse(line)
                  if fields is None:
                      unexpected.append(line)
                      continue
                  severity, kind, code, file, row, col, _, message = fields
                  if (severity == "INFO" and kind == "HINT" and code == "DEPRECATED_MEMBER_USE"
                          and message in EXCLUDED):
                      excluded[message] += 1
                      continue
                  remaining.append((severity, code, os.path.relpath(file, workspace), row, col, message))

          total = sum(excluded.values())
          print(f"dart analyze exited with {status}.")
          print(f"Excluded {total} material_ui / cupertino_ui migration notice(s):")
          for message, count in sorted(excluded.items()):
              print(f"  {count:4d}  {message}")
          print(f"::notice::Excluded {total} material_ui / cupertino_ui migration notice(s) from analyze.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Analyze (stable)\n\nExcluded {total} material_ui / cupertino_ui migration notice(s).\n\n")
              for message, count in sorted(excluded.items()):
                  summary.write(f"- {count} × {message}\n")

          for severity, code, file, row, col, message in remaining:
              print(f"::error file={file},line={row},col={col}::{severity} {code.lower()}: {message}")
          for line in unexpected:
              print(f"Unexpected analyzer output: {line}")

          if remaining or unexpected:
              print(f"::error::{len(remaining)} diagnostic(s) and {len(unexpected)} unexpected line(s) remain after the exclusion.")
              sys.exit(1)
          # --fatal-infos では、診断なしが 0、info だけが 1。warning・error は 2・3 で、
          # それ以外 (解析の異常終了など) は除外件数にかかわらず失敗させる
          if status not in (0, 1):
              print(f"::error::dart analyze exited with {status}.")
              sys.exit(1)
          if status == 1 and total == 0:
              print("::error::dart analyze exited with 1 without reporting diagnostics.")
              sys.exit(1)
          PY

      - name: Run tests
        run: flutter test --exclude-tags golden

      - name: Validate package
        run: dart pub publish --dry-run

  golden:
    name: Golden (Flutter 3.38.7 / Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Match the baseline generation environment, including architecture.
    container:
      image: ghcr.io/cirruslabs/flutter@sha256:0e6b31fba1e9849cf54939ad76cbbff3e10ad8a1ca3d5b34ea274921343a5eae
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: flutter pub get

      - name: Compare goldens
        run: flutter test --tags golden --concurrency=1

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  example:
    name: Example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # exampleを各デスクトップOSでビルドする
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Run example tests
        working-directory: example
        run: flutter test

      - name: Build example
        working-directory: example
        run: flutter build ${{ matrix.target }} --release

  # 公開済みバージョンとの公開API差分を報告する。CHANGELOG で宣言した影響度と
  # 実際のAPI差分の食い違いは、これまでリリース後にしか分からなかった。
  #
  # 報告のみで、gate の needs には入れない。破壊的変更の有無からバージョンを
  # 機械的に決めるのは誤検知の余地があり、判断は人間に残す。
  api-diff:
    name: API diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dart_apitool
        run: dart pub global activate dart_apitool 0.23.2

      - name: Diff the public API against the published version
        run: |
          set -euo pipefail

          name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*$/\1/p' pubspec.yaml)"
          if [ "$(printf '%s\n' "$name" | grep -c .)" != "1" ]; then
            echo "::error::pubspec.yaml must declare exactly one top-level name."
            exit 1
          fi

          # 比較できなかった理由をサマリに残して正常終了する
          skip() {
            {
              echo "## API diff"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # pub.dev は未知のパッケージに 404 と XML 本文を返す。本文を読む前に
          # HTTP ステータスで分岐し、未公開と通信障害を区別する。
          payload="$RUNNER_TEMP/pub-api.json"
          http="$(curl -sS -o "$payload" -w '%{http_code}' \
            "https://pub.dev/api/packages/$name" || true)"
          case "${http:-000}" in
            200) ;;
            404) skip "\`$name\` is not published yet. Nothing to diff against." ;;
            *)   skip "Could not reach pub.dev (HTTP ${http:-000}). Skipped the comparison." ;;
          esac

          published="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("latest",{}).get("version",""))' \
            < "$payload" 2>/dev/null || true)"
          if [ -z "$published" ]; then
            skip "pub.dev returned an unexpected payload for \`$name\`. Skipped the comparison."
          fi

          report="$RUNNER_TEMP/api-diff.md"
          log="$RUNNER_TEMP/api-diff.log"

          # 破壊的変更があっても CI は落とさない
          set +e
          dart pub global run dart_apitool:main diff \
            --old "pub://$name/$published" \
            --new . \
            --no-set-exit-on-version-check-failure \
            --report-format markdown \
            --report-file-path "$report" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e

          {
            echo "## API diff"
            echo
            echo "Compared against \`pub://$name/$published\`."
            echo "This job is advisory: it is not a required check, so it never blocks the merge."
            echo
            if [ "$status" != "0" ]; then
              echo "> dart_apitool exited with $status. See the job log."
              echo
            fi
            if [ -f "$report" ]; then
              sed -e '/^# API Changes Report$/d' \
                  -e '/^## ℹ️ API-Tool Info$/,/^$/d' \
                  -e '/^## Report$/d' "$report"
              echo
            fi
            # バージョン判定は標準出力側にしか出ない。ツールが途中で失敗すると節ごと
            # 存在しないため、抽出できなくても失敗させない。
            if [ -f "$log" ]; then
              { sed -n '/^### Version Check$/,$p' "$log" \
                  | sed '/^Markdown report generated at /d' \
                  | grep -vE '^(IO|MSG|SLVR|FINE|WARN|ERR) +:'; } || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs (6 locales)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run check:audit
      - run: npm run check:translations
      - run: npm run typecheck
      - run: npm run build

      - name: Upload Pages artifact
        if: github.repository == 'LibraryLibrarian/misskey_mfm_renderer' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy-pages:
    name: Deploy Docs
    needs: [docs, gate]
    if: github.repository == 'LibraryLibrarian/misskey_mfm_renderer' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.docs.result == 'success' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check current develop commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read a valid develop commit"
            exit 1
          fi
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Docs deployment skipped: this run is no longer the develop HEAD." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Docs deployment candidate: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

  gate:
    name: all checks passed
    needs: [quality, example, golden, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure all deps succeeded
        env:
          # 既存ジョブのスキップは許容するが、docsは成功を必須とする
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.docs.result != 'success' }}
        run: |
          echo 'Needs: ${{ toJson(needs) }}'
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
